name: Feature request
description: Something heraldarr should do that it doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What you, or the friends reading your channel, run into today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like instead?
      description: How it would look or behave. A mock-up of a card is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried or considered
