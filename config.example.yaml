# heraldarr configuration. Every secret can be inline, {file: path} or {env: NAME}; files are best
# (nothing shows up in `docker inspect`).

server:
  listen: ":8790"
  data_dir: /config/data
  # How Sonarr/Radarr reach heraldarr; `heraldarr setup` points their Webhook at <public_url>/hook/<source>.
  # On a shared Docker network that's the container name; otherwise an address the *arrs can reach.
  public_url: http://heraldarr:8790
  # The *arr Webhook connection sends these as Username / Password.
  auth:
    username: heraldarr
    password: {file: /config/secrets/webhook_password}
  # Optional dead man's switch (healthchecks.io style): GET at most once a minute while healthy.
  # heartbeat_url: {file: /config/secrets/heartbeat_url}

# timing:                   # defaults shown
#   quiet_episodes: 5m      # new episodes people follow (aired within following_window)
#   quiet_backlog: 30m      # back-catalog series and seasons trickling in
#   quiet_movies: 5m
#   max_hold: 4h
#   following_window: 336h  # 14 days
#   following_early: 24h    # imported up to this long before its air date still counts as new
#   digest_from: 4          # this many movies at once -> one digest card
#   reannounce_after: 720h  # 30 days
#   retry_interval: 2m
#   retry_max: 30

# Back-catalog TV: episodes that aired more than following_window ago. Requesting old seasons makes
# them arrive one download at a time over hours or days, so they're grouped into a run per show:
# announced once, then folded into that card instead of posting again.
# backlog:                  # defaults shown
#   mode: lead              # lead: post when the first episodes land, fold later ones into that card
#                           # complete: post one card once the *arr has nothing left queued for the run
#                           # quiet: no runs, a card per quiet_backlog window (the old behavior)
#   scope: series           # series: one run per show; season: one per season
#   edit: true              # edit the card as episodes land (silent in Discord); false: just skip them
#   settle: 5m              # quiet before a card or an edit (a season pack lands in a minute or two)
#   idle: 24h               # a run ends after this long with no new episode
#   max_hold: 24h           # complete: post anyway this long after the run's first episode

media_server:               # optional; without it cards have no "Open in Plex" button
  type: plex
  url: http://plex:32400
  token: {file: /config/secrets/plex_token}
  # preferences_xml: /plex/Preferences.xml   # instead of token: read it from Plex's own config
  path_map:                 # how the *arrs' paths look to Plex
    - {from: /data/media/, to: /media/}

sources:
  # `heraldarr setup` adds the Webhook connection to each of these (On Import only).
  - name: sonarr
    kind: sonarr
    url: http://sonarr:8989
    api_key: {file: /config/secrets/sonarr_api_key}
    # config_xml: /sonarr/config.xml         # instead of api_key: read it from the app's config
  - name: radarr
    kind: radarr
    url: http://radarr:7878
    api_key: {file: /config/secrets/radarr_api_key}

destinations:
  - name: tv
    webhook_url: {file: /config/secrets/discord_tv}
    username: New TV
    public: true
  - name: movies
    webhook_url: {file: /config/secrets/discord_movies}
    username: New Movies
    public: true

routes:
  - {sources: [sonarr], destination: tv}
  - {sources: [radarr], destination: movies}
  # A private 4K instance with technical footers (only allowed on non-public destinations):
  # - sources: [radarr4k]
  #   destination: private
  #   style: {label: 4K, color: "#9B59B6", tech_details: true}
